# Lança uma versão do Braid: ao subir uma tag v* (ex.: v0.1.0), monta o instalador do
# Windows (.exe) e o AppImage do Linux e publica os dois numa Release do GitHub.
name: Lançar versão

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  montar:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run instalador
      - uses: actions/upload-artifact@v4
        with:
          name: braid-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  publicar:
    needs: montar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" arquivos/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Braid $GITHUB_REF_NAME" \
            --notes "Windows: baixe o arquivo .exe e instale. Linux: baixe o .AppImage, marque como executável e abra."
